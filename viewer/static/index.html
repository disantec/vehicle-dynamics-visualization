<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suspension kinematics viewer</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Suspension kinematics</h1>
        <p class="sub">Atom 3 starting point · drag a hardpoint · pose is always on the right</p>
      </div>
      <div class="views" id="view-btns">
        <button data-view="iso" class="active">Iso</button>
        <button data-view="front">Front</button>
        <button data-view="rear">Rear</button>
        <button data-view="side">Side</button>
        <button data-view="top">Top</button>
      </div>
      <div class="top-actions">
        <button id="btn-reset">Reset defaults</button>
        <button id="btn-yaml">Download YAML</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel left">
        <section>
          <h2>Hardpoints (left side)</h2>
          <p class="hint">Click a point in the 3D view or here. Right side mirrors.</p>
          <div id="point-list"></div>
        </section>
        <section id="editor" class="hidden">
          <h2 id="editor-title">Selected</h2>
          <div class="xyz">
            <label>X <input id="ed-x" type="number" step="1" /></label>
            <label>Y <input id="ed-y" type="number" step="1" /></label>
            <label>Z <input id="ed-z" type="number" step="1" /></label>
          </div>
          <p class="hint">Drag the gizmo in the scene, or type. Units mm.</p>
        </section>
        <section>
          <h2>Alignment</h2>
          <label class="row">Front camber
            <input id="front-camber" type="number" step="0.05" />
          </label>
          <label class="row">Front toe
            <input id="front-toe" type="number" step="0.05" />
          </label>
          <label class="row">Rear camber
            <input id="rear-camber" type="number" step="0.05" />
          </label>
          <label class="row">Rear toe
            <input id="rear-toe" type="number" step="0.05" />
          </label>
        </section>
      </aside>

      <section class="stage">
        <div id="canvas-wrap"></div>
        <div id="status"></div>
      </section>

      <aside class="panel right">
        <section>
          <h2>Pose</h2>
          <div class="modes">
            <button data-mode="heave" class="active">Heave</button>
            <button data-mode="roll">Roll</button>
            <button data-mode="pitch">Pitch</button>
            <button data-mode="corners">Corners</button>
          </div>
          <div id="pose-heave" class="pose-block">
            <label>Heave <span id="heave-val">0</span> mm
              <input id="heave" type="range" min="-40" max="40" step="1" value="0" />
            </label>
          </div>
          <div id="pose-roll" class="pose-block hidden">
            <label>Roll <span id="roll-val">0</span>°
              <input id="roll" type="range" min="-4" max="4" step="0.1" value="0" />
            </label>
          </div>
          <div id="pose-pitch" class="pose-block hidden">
            <label>Pitch <span id="pitch-val">0</span>°
              <input id="pitch" type="range" min="-3" max="3" step="0.1" value="0" />
            </label>
          </div>
          <div id="pose-corners" class="pose-block hidden">
            <label>FL <span id="fl-val">0</span>
              <input id="tr-FL" type="range" min="-40" max="40" step="1" value="0" />
            </label>
            <label>FR <span id="fr-val">0</span>
              <input id="tr-FR" type="range" min="-40" max="40" step="1" value="0" />
            </label>
            <label>RL <span id="rl-val">0</span>
              <input id="tr-RL" type="range" min="-40" max="40" step="1" value="0" />
            </label>
            <label>RR <span id="rr-val">0</span>
              <input id="tr-RR" type="range" min="-40" max="40" step="1" value="0" />
            </label>
          </div>
        </section>
        <section>
          <h2>Live corners</h2>
          <div id="live"></div>
        </section>
        <section>
          <h2>Roll centres</h2>
          <div id="rc"></div>
        </section>
      </aside>
    </main>

    <footer class="plots">
      <canvas id="plot-camber"></canvas>
      <canvas id="plot-toe"></canvas>
      <canvas id="plot-rc"></canvas>
    </footer>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
